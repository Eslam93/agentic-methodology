# Methodology guard — CI enforcement of the constitution build + lint (ADR-0003).
# Ships with the methodology as the ready-to-paste guard job. Adopters: copy this into your repo's
# .github/workflows/ and point it at your default branch. This same file also self-guards the
# methodology repo (it dogfoods ADR-0003).
name: methodology-guard
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild the constitution from the spine
        run: sh build-constitution.sh
      - name: Fail if AGENTS.md is stale vs the spine
        run: git diff --exit-code AGENTS.md
      - name: Lint the methodology docs
        run: sh lint-methodology.sh
