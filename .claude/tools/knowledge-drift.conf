# Curated documentation drift, for this repository.
#
# The tree is authoritative, the documentation repeats a value derived from it, and verify.sh proves
# they agree. A quantity earns a line here only when three things hold: the value is deterministic,
# the documentation states it on purpose, and a disagreement would mislead a reader. This is not a
# sweep of every number in the README, and it is not a prose consistency engine.
#
#   <quantity> <args> :: <documentation file> :: <extended regex>
#
# The regex is matched against the documentation file, and the first match that BEGINS with a number
# (a digit, or an English word up to twenty) carries the stated value. A pattern matching nothing, or
# nothing that begins with a number, FAILS: a broken pattern must never read as a clean tree.
#
# Quantities: subdirs <dir> | stems <dir> | table_rows <file> | table_rows_with <file> <col> <word>
# `stems` counts distinct script names, so install.sh and install.ps1 are one tool and a data file
# beside them is none.
#
# DELIBERATELY NOT HERE, and why:
#   the rule count. The README's "four rules" means the kit's rules; this repository carries a fifth,
#   its own project rule, and every install has one under its own name. The tree cannot tell a kit
#   rule from a project rule, so the count is not deterministic and the check would be red for the
#   wrong reason. Recorded in 99-pending.md instead.
#
#   decisions.md. Its D-03 heading says "4 rules, 10 skills, 4 hooks, 3 tools", which is a dated
#   record of what was decided on 2026-09-05, not a claim about the current tree. A decision entry is
#   history and must not be rewritten to match today.

subdirs .claude/skills :: README.md :: [a-z]+ skills,
stems .claude/hooks :: README.md :: [a-z]+ hooks,
stems .claude/tools :: README.md :: [a-z]+ tools\.
table_rows docs/knowledge-base/_investigations/2026-09-05-v2-rewrite/acceptance.md :: README.md :: [A-Za-z]+ acceptance tests,
table_rows_with docs/knowledge-base/_investigations/2026-09-05-v2-rewrite/acceptance.md 3 passed :: README.md :: [a-z]+ passed,
table_rows_with docs/knowledge-base/_investigations/2026-09-05-v2-rewrite/acceptance.md 3 live :: README.md :: [a-z]+ of them live
